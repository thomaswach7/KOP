[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creo-mcp"
version = "0.1.0"
description = "MCP-Server für PTC Creo Parametric (CREOSON, Mapkeys, VB-API) inkl. Modellbaum"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
windows = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
creo-mcp = "creo_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creo_mcp = ["specs/*.json", "specs/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
